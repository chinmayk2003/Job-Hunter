version: "3.8"

services:
  # --- PostgreSQL Database Service ---
  db:
    image: postgres:16-alpine
    container_name: jobhunter_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-jobhunter_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Redis Cache & Celery Broker Service ---
  redis:
    image: redis:7-alpine
    container_name: jobhunter_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- FastAPI Backend Web Server ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: jobhunter_backend
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-jobhunter_db}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - /app/.venv # Protect the virtual environment inside the container from being overwritten by host mount
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- Celery Worker for Background Tasks ---
  worker:
    build:
      context: ./workers
      dockerfile: Dockerfile
      target: development
    container_name: jobhunter_worker
    restart: always
    command: celery -A app.tasks.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-jobhunter_db}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./workers:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- Flower Celery Monitoring Dashboard ---
  flower:
    build:
      context: ./workers
      dockerfile: Dockerfile
      target: development
    container_name: jobhunter_flower
    restart: always
    command: celery -A app.tasks.celery_app flower --port=5555 --url_prefix=flower
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy

  # --- Next.js Frontend Service ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: jobhunter_frontend
    restart: always
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
    volumes:
      - ./frontend:/app
      - /app/node_modules # Avoid overriding container node_modules
      - /app/.next # Avoid overriding build cache
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # --- Nginx Reverse Proxy / Load Balancer ---
  nginx:
    build:
      context: ./infra/nginx
      dockerfile: Dockerfile
    container_name: jobhunter_nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
      - flower

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
